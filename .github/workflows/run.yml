name: Daily Snippet Bot (3AM KST)

on:
  schedule:
    # 한국 시간 기준 매일 새벽 3시 (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 테스트용 버튼

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run automation script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
          SNIPPET_API_KEY: ${{ secrets.SNIPPET_API_KEY }}
        run: python main.py
